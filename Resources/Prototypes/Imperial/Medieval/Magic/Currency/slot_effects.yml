# Effects around the player while a school is put into an essence slot of a grimoire (3 seconds).
# All of them are the cast circle of the fireball (fire/fireball.rsi, state beginner): it lasts exactly 3 seconds, plays once
# (it grows slowly, holds and fades) and is tinted in the colour of the school. The lifetime is the length of the animation.
# The colour of a child is the colour of its school (the currency in this folder), set in the sprite and in the light.

- type: entity
  id: ImperialStoreSlotEffectBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Medieval/SpellCastEffects/fire/fireball.rsi
    noRot: true
    layers:
      - state: beginner
        shader: unshaded
  - type: PointLight
    radius: 2.5
    energy: 1
  - type: TimedDespawn
    lifetime: 3.0

- type: entity
  id: ImperialStoreSlotEffectFire
  parent: ImperialStoreSlotEffectBase
  components:
  - type: Sprite
    color: "#FF5900"
  - type: PointLight
    color: "#FF5900"

- type: entity
  id: ImperialStoreSlotEffectLight
  parent: ImperialStoreSlotEffectBase
  components:
  - type: Sprite
    color: "#FFE57E"
  - type: PointLight
    color: "#FFE57E"

- type: entity
  id: ImperialStoreSlotEffectVodka
  parent: ImperialStoreSlotEffectBase
  components:
  - type: Sprite
    color: "#78C6ED"
  - type: PointLight
    color: "#78C6ED"

- type: entity
  id: ImperialStoreSlotEffectEarth
  parent: ImperialStoreSlotEffectBase
  components:
  - type: Sprite
    color: "#838275"
  - type: PointLight
    color: "#838275"
    energy: 0.8

- type: entity
  id: ImperialStoreSlotEffectDarkness
  parent: ImperialStoreSlotEffectBase
  components:
  - type: Sprite
    color: "#B600FF"
  - type: PointLight
    color: "#B600FF"
