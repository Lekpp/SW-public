- type: entity
  id: FireFistsBeginner
  parent: BaseItem
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Magic/Fire/FireFists/projectiles.rsi
    state: icon
  - type: Unremoveable
  - type: PointLight
    radius: 2
    energy: 1.0
    color: "#FF9C24"
  - type: TimedDespawn
    lifetime: 20
  - type: MedievalSpawnOnMeleeHit
    prototype: FireFistsHitEffect
  - type: MeleeWeapon
    resetOnHandSelected: false
    autoAttack: true
    animation: WeaponArcFist
    wideAnimationRotation: 0
    angle: 0
    attackRate: 0.5
    damage:
      types:
        Blunt: 3
        Heat: 6

- type: entity
  id: FireFistsMiddle
  parent: BaseItem
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Magic/Fire/FireFists/projectiles.rsi
    state: icon
  - type: Unremoveable
  - type: PointLight
    radius: 3
    energy: 1.5
    color: "#FF9C24"
  - type: TimedDespawn
    lifetime: 25
  - type: MedievalSpawnOnMeleeHit
    prototype: FireFistsHitEffect
  - type: MeleeWeapon
    resetOnHandSelected: false
    autoAttack: true
    animation: WeaponArcFist
    wideAnimationRotation: 0
    angle: 0
    attackRate: 0.7
    damage:
      types:
        Blunt: 4
        Heat: 7.5

- type: entity
  id: FireFistsSenior
  parent: BaseItem
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Magic/Fire/FireFists/projectiles.rsi
    state: icon
  - type: Unremoveable
  - type: PointLight
    radius: 4
    energy: 2.0
    color: "#FF9C24"
  - type: TimedDespawn
    lifetime: 30
  - type: MedievalSpawnOnMeleeHit
    prototype: FireFistsHitEffect
  - type: MeleeWeapon
    resetOnHandSelected: false
    autoAttack: true
    animation: WeaponArcFist
    wideAnimationRotation: 0
    angle: 0
    attackRate: 0.9
    damage:
      types:
        Blunt: 5
        Heat: 10

- type: entity
  id: FireFistsHitEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Magic/Fire/FireFists/hit.rsi
    noRot: true
    drawdepth: Effects
    layers:
    - state: hit
      shader: unshaded
  - type: PointLight
    radius: 2
    energy: 1
    color: "#FF9C24"
  - type: TimedDespawn
    lifetime: 0.4
