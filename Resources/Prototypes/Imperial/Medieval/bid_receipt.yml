- type: entity
  parent: BaseItem
  id: MedievalBidReceipt
  name: bid receipt
  description: A receipt assigning part of the proceeds from a lot.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: paper
      map: [ "bidReceipt" ]
  - type: Item
    size: Tiny
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.BidReceiptVisuals.Status:
        bidReceipt:
          Pending:
            state: paper
          Succeeded:
            state: paper
          Failed:
            state: paper
          Redeemed:
            state: paper
  - type: BidReceipt
  - type: Undrowable
