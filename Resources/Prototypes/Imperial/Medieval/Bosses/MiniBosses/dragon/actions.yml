- type: entity
  id: MedievalActionBlinkDragon
  name: medieval-store-spells-light-blink-dragon-name
  description: medieval-store-spells-light-blink-dragon-desc
  components:
  - type: ManaDrainSpell
    manaDrain: 85
    canUseWithoutMana: false # NO MORE BUGS
    manaLowMessage: medieval-spell-speach-not-enough-mana-fire-spell
    damageOnUseWithoutMana:
      groups:
        Burn: 15
  - type: MedievalTargetSpell
  - type: Action
    useDelay: 1
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Weapons/Guns/Gunshots/Magic/staff_healing.ogg
    icon:
      sprite: Imperial/Medieval/Magic/Light/Blink/icons.rsi
      state: beginner
  - type: TargetAction
    checkCanAccess: false
    range: 4
  - type: WorldTargetAction
    event: !type:MedievalTeleportSpellEvent
      spellCastDoAfter:
        delay: 1.7
        breakOnDropItem: false
        breakOnWeightlessMove: false
        breakOnMove: false
        needHand: true
      speechPoints:
        0:
          speech: medieval-spell-speach-blink
          color: "#7D7D7D"
          hideChat: true
  - type: ShowSpawnedEntity
    sprites:
      - drawedSprite:
          sprite: Imperial/Medieval/Magic/Light/Blink/icons.rsi
          state: beginner
        inRangeColor: "#000062"
        outOfRangeColor: "#4A5076"
        alwaysRender: true
        range: 4
    rotationPerClick: 0
  - type: MedievalSpellTeleportEffect
    fadeDistortion:
      - type: PhaseSpaceDistortion
        isMove: false
        needSpriteVisible: false
        distortions:
          - relativePosition: 0,0
            fadePosition: 1,0
            distortionPathTime: 1
          - relativePosition: 0,0
            fadePosition: -1,0
            distortionPathTime: 1
          - relativePosition: 0,0
            fadePosition: 0,1
            distortionPathTime: 1
          - relativePosition: 0,0
            fadePosition: 0,-1
            distortionPathTime: 1
    appearanceDistortion:
      - type: PhaseSpaceDistortion
        isMove: true
        needSpriteVisible: false
        distortions:
          - relativePosition: 1,0
            fadePosition: 1,0
            distortionPathTime: 1
          - relativePosition: -1,0
            fadePosition: -1,0
            distortionPathTime: 1
          - relativePosition: 0,1
            fadePosition: 0,1
            distortionPathTime: 1
          - relativePosition: 0,-1
            fadePosition: 0,-1
            distortionPathTime: 1

- type: entity
  parent: BaseAction
  id: MedievalActionDragonTailSweep
  name: tail sweep
  description: The dragon spins in place and lashes everyone around it with its tail.
  components:
  - type: Action
    useDelay: 20
    itemIconStyle: BigAction
    icon:
      sprite: Imperial/Medieval/Mobs/Bosses/Dragons/tail_sweep.rsi
      state: icon
  - type: InstantAction
    event: !type:MedievalTailSweepActionEvent

- type: entity
  id: MedievalEffectDragonTailSweep
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Imperial/Medieval/Mobs/Bosses/Dragons/tail_sweep_effect.rsi
    state: effect
    drawdepth: BelowMobs
    noRot: true
  - type: TimedDespawn
    lifetime: 0.45
  - type: Tag
    tags:
    - HideContextMenu
