- type: entity
  id: Bonfire
  parent: BaseStructure
  name: bonfire
  description: A roaring fire under the open sky. Meat can be grilled right on the coals. # imperial medieval
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Decoration/bonfire.rsi
    layers:
      - state: bonfire
      - state: burning
  - type: PointLight
    radius: 5
    energy: 3
    color: "#FFC90C"
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 50
        behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
  - type: AmbientSound
    volume: -5
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: AlwaysHot
  # imperial medieval start - grill food on the open fire
  - type: Fixtures
    fixtures:
      fix1: # same as BaseStructure
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
      itemcollide: # what lies on the coals, same setup as the stock heater machines
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        layer:
        - HighImpassable
        hard: false
  - type: ItemPlacer
    maxEntities: 4
    whitelist:
      requireAll: true
      components:
      - Item
      - Temperature
  - type: MedievalFireGrill
    heatPerSecond: 650 # a raw steak cooks in about 10 s
    whitelist:
      requireAll: true
      components:
      - Item
      - Temperature
    blacklist:
      components:
      - MobState
  # imperial medieval end

- type: entity
  id: LegionnaireBonfire
  parent: Bonfire
  name: legionnaire bonfire
  description: The legion's camp fire. Meat can be grilled right on the coals. # imperial medieval
  components:
  - type: Sprite
    layers:
      - state: legionnaire_bonfire
  - type: PointLight
    color: "#FF5601"
